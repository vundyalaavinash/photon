# photon: builds Photon.app for a photon-v* tag and publishes it as a GitHub release.
name: Photon Release

on:
  push:
    tags: ["photon-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing photon-v* tag to (re)build"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 360
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain
      - name: Install build prerequisites
        run: |
          brew install cmake
          xcodebuild -downloadComponent MetalToolchain || true
      - name: Build the stable app
        # Unset secrets leave these empty, and bundle-mac falls back to an ad-hoc signed, un-notarized build.
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_NOTARIZATION_KEY: ${{ secrets.APPLE_NOTARIZATION_KEY }}
          APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
          APPLE_NOTARIZATION_ISSUER_ID: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}
          APPLE_NOTARIZATION_TEAM: ${{ secrets.APPLE_NOTARIZATION_TEAM }}
        run: |
          echo stable > crates/zed/RELEASE_CHANNEL
          script/bundle-mac aarch64-apple-darwin
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dmg="target/aarch64-apple-darwin/release/Photon-aarch64.dmg"
          notes="docs/photon/releases/${TAG}.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$dmg" --clobber
          else
            gh release create "$TAG" "$dmg" --title "Photon ${TAG#photon-v}" --notes-file "$notes"
          fi
