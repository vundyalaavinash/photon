name: Photon

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: photon-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name != 'schedule'
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: Install build prerequisites
        run: |
          brew install cmake cargo-nextest
          xcodebuild -downloadComponent MetalToolchain || true
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (Photon-touched crates)
        run: >
          ./script/clippy -p photon_brand -p paths -p release_channel -p cli -p install_cli
          -p agent_ui -p extension_host -p extensions_ui -p settings -p settings_content
          -p project -p workspace -p zed_credentials_provider -p zed
          -p ui
          -p photon_blocks -p photon_terminal -p photon_review -p terminal -p terminal_view
          -p tabular_data_preview
      - name: Tests (Photon-touched crates)
        run: >
          cargo nextest run -p photon_brand -p paths -p release_channel -p cli -p install_cli
          -p agent_ui -p project -p settings -p settings_content -p ui -p theme_settings -p zed_credentials_provider -p zed
          -p photon_blocks -p photon_terminal -p photon_review -p terminal -p terminal_view
          -p tabular_data_preview
          -E 'package(photon_brand) | package(paths) | package(release_channel) | package(cli)
          | package(settings) | package(settings_content) | package(ui) | package(theme_settings) | package(zed_credentials_provider)
          | package(photon_blocks) | package(photon_terminal) | package(photon_review) | package(terminal) | package(terminal_view)
          | package(tabular_data_preview)
          | test(photon) | test(new_window)
          | test(agent_registry) | test(default_agent_is_claude)'
      - name: Tests (vendored alacritty_terminal marks patch)
        run: cargo test --manifest-path vendor/alacritty_terminal/Cargo.toml --test photon_marks

  perf:
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: Install build prerequisites
        run: |
          brew install cmake
          xcodebuild -downloadComponent MetalToolchain || true
      - name: Build release
        run: cargo build --release -p zed -p cli
      - name: Network silence
        run: script/photon-netcheck
      - name: Performance (report only)
        # The committed baseline was measured on an M1 Max; shared runners are slower and noisy.
        # Report-only until a runner baseline exists. The local pre-merge run is the gate.
        continue-on-error: true
        run: script/photon-perf --no-build --threshold 20
